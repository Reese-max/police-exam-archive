name: Temporary extract 115 English PDF

on:
  push:
    branches:
      - integration/unify-practice-site-v2
    paths:
      - .github/workflows/tmp-extract-115-english.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/unify-practice-site-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: Extract official PDF text
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz

          source = Path('考古題庫/行政警察學系/115年/中華民國憲法與警察專業英文/試題.pdf')
          target = Path('tmp/115-english-pdf.txt')
          target.parent.mkdir(parents=True, exist_ok=True)
          with fitz.open(source) as document:
              parts = []
              for index, page in enumerate(document, start=1):
                  parts.append(f'===== PAGE {index} =====\n')
                  parts.append(page.get_text('text'))
              target.write_text('\n'.join(parts), encoding='utf-8')
          print(f'extracted {target.stat().st_size} bytes')
          PY

      - name: Commit extracted text
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/115-english-pdf.txt
          git commit -m 'chore: extract official 115 English PDF text'
          git push origin HEAD:integration/unify-practice-site-v2
