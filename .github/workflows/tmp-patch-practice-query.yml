name: Temporary patch practice query migration

on:
  push:
    branches:
      - integration/unify-practice-platform
    paths:
      - .github/workflows/tmp-patch-practice-query.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/unify-practice-platform
          fetch-depth: 0

      - name: Preserve pending subject until dynamic options exist
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('考古題網站/practice.html')
          text = path.read_text(encoding='utf-8')
          old = "function applyPending(){['category','year','subject'].forEach(function(id){var value=$(id).dataset.pending;if(value&&Array.from($(id).options).some(function(option){return option.value===value}))$(id).value=value;delete $(id).dataset.pending})}"
          new = "function applyPending(){['category','year','subject'].forEach(function(id){var value=$(id).dataset.pending;if(!value)return;if(Array.from($(id).options).some(function(option){return option.value===value})){$(id).value=value;delete $(id).dataset.pending}})}"
          if old not in text:
              raise SystemExit('target function not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/check_frontend_inline_js.py 考古題網站/practice.html

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 考古題網站/practice.html
          git commit -m 'fix: preserve legacy subject query during migration'
          git push origin HEAD:integration/unify-practice-platform
