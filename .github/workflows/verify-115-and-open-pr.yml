name: Verify 115 import and open PR

on:
  push:
    branches:
      - data/add-115-police-exam
    paths:
      - .github/workflows/verify-115-and-open-pr.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: verify-115-and-open-pr
  cancel-in-progress: false

jobs:
  verify-and-propose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out ingestion branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fix answer token boundary and run parser unit tests
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/parse/answer_extractor.py')
          text = path.read_text(encoding='utf-8')
          old = r'(?:(?:\s*[或、,，/／]\s*|\s*)[A-DＡ-Ｄ])'
          new = r'(?:(?:\s*[或、,，/／]\s*)[A-DＡ-Ｄ])'
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m py_compile \
            scripts/download/download_115_police.py \
            scripts/parse/answer_extractor.py \
            scripts/audit/finalize_115_import.py
          python -m pytest tests/test_answer_extractor.py -q

      - name: Download official 115 exam PDFs
        run: |
          python scripts/download/download_115_police.py \
            --output 考古題庫 \
            --workers 4 | tee /tmp/115-download.log

      - name: Assert official coverage before parsing
        run: |
          test -f 考古題庫/115_import_manifest.json
          questions=$(find 考古題庫 -mindepth 3 -maxdepth 3 -type f -path '*/115年/*/試題.pdf' | wc -l)
          corrections=$(find 考古題庫 -mindepth 3 -maxdepth 3 -type f -path '*/115年/*/更正答案.pdf' | wc -l)
          echo "question PDFs=${questions}; corrected answers=${corrections}"
          test "${questions}" -eq 90
          test "${corrections}" -eq 4

      - name: Parse all 115 question PDFs
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/115-parse.log
          while IFS= read -r -d '' year_dir; do
            python scripts/parse/pdf_to_questions.py \
              --input "${year_dir}" \
              --workers 2 \
              --force \
              --quality-threshold 0.70 \
              --log-level WARNING | tee -a /tmp/115-parse.log
          done < <(find 考古題庫 -mindepth 2 -maxdepth 2 -type d -name '115年' -print0 | sort -z)

      - name: Run deterministic 115 finalizer
        run: |
          python scripts/audit/finalize_115_import.py | tee /tmp/115-audit.log

      - name: Run full repository tests
        run: |
          python -m pytest tests/ -v --tb=short | tee /tmp/115-pytest.log

      - name: Build search and analytics outputs
        run: |
          python scripts/build_search_index.py --output /tmp/search-index.json
          python scripts/build_analytics.py --output /tmp/analytics.json
          test -s /tmp/search-index.json
          test -s /tmp/analytics.json

      - name: Commit verified generated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'data: add verified 115 police exam archive'
            git push origin HEAD:data/add-115-police-exam
          fi

      - name: Open pull request after all gates pass
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head data/add-115-police-exam \
            --base master \
            --state open \
            --json number \
            --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --head data/add-115-police-exam \
              --base master \
              --title 'data: 收錄 115 年三等警察特考考古題' \
              --body-file docs/115-import-report.md
          else
            echo 'An open pull request already exists.'
          fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-115-police-exams
          if-no-files-found: warn
          path: |
            /tmp/115-download.log
            /tmp/115-parse.log
            /tmp/115-audit.log
            /tmp/115-pytest.log
            docs/115-import-report.md
            考古題庫/115_import_manifest.json
            考古題庫/dataset_manifest.json
