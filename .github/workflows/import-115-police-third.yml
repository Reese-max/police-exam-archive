name: Import 115 police third-class exams

on:
  push:
    branches:
      - data/import-115-police-third
    paths:
      - .github/workflows/import-115-police-third.yml
      - scripts/download/import_115_police_third.py
      - scripts/audit/validate_115_police_third.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-115-police-third
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install importer and parser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            requests beautifulsoup4 lxml urllib3 \
            pdfplumber tqdm wordninja PyMuPDF pytest

      - name: Download official 115 exam PDFs from MOEX
        run: python scripts/download/import_115_police_third.py

      - name: Parse PDFs into the repository JSON format
        run: |
          python scripts/parse/pdf_to_questions.py \
            --input 考古題庫 \
            --workers 2 \
            --force \
            --no-ocr \
            --extractor pdfplumber \
            --quality-threshold 0.55 \
            --manifest /tmp/parse_manifest_115.json \
            --log-level INFO

      - name: Validate the 115 import
        run: python scripts/audit/validate_115_police_third.py

      - name: Run repository tests
        run: python -m pytest tests/ -q --tb=short

      - name: Remove ignored source PDFs and restore aggregate reports
        run: |
          find 考古題庫 -type f -name '*.pdf' -delete
          git restore --source=HEAD -- \
            考古題庫/download_summary.json \
            考古題庫/extraction_stats.json \
            考古題庫/problematic_pdfs.json 2>/dev/null || true

      - name: Commit generated JSON data to the import branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ':(glob)考古題庫/*/115年/**/試題.json'
          git add reports/import_115_police_third.json
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "data: import 115 third-class police exam questions"
          git push origin HEAD:${GITHUB_REF_NAME}
