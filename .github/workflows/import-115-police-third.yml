name: Rebuild 115 police third-class exams

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Existing branch that will receive the rebuilt 115 JSON files
        required: true
        default: data/import-115-police-third
        type: string

permissions:
  contents: write

concurrency:
  group: rebuild-115-police-third-${{ inputs.target_branch }}
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install importer and parser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            requests beautifulsoup4 lxml urllib3 \
            pdfplumber tqdm wordninja PyMuPDF pytest

      - name: Download official 115 exam PDFs from MOEX
        run: python scripts/download/import_115_police_third.py

      - name: Parse PDFs into the repository JSON format
        run: |
          python scripts/parse/pdf_to_questions.py \
            --input 考古題庫 \
            --workers 2 \
            --force \
            --no-ocr \
            --extractor pdfplumber \
            --quality-threshold 0.55 \
            --manifest /tmp/parse_manifest_115.json \
            --log-level INFO

      - name: Repair PDF-layout edge cases and apply official corrections
        id: repair
        continue-on-error: true
        run: python scripts/parse/repair_115_police_third.py

      - name: Remove leaked page metadata from question text
        id: clean
        if: always()
        continue-on-error: true
        run: python scripts/parse/clean_115_metadata.py

      - name: Validate the 115 import
        id: validate
        if: always()
        continue-on-error: true
        run: python scripts/audit/validate_115_police_third_strict.py

      - name: Run repository tests
        id: tests
        if: always()
        continue-on-error: true
        run: python -m pytest tests/ -q --tb=short

      - name: Remove ignored source PDFs and restore aggregate reports
        if: always()
        run: |
          find 考古題庫 -type f -name '*.pdf' -delete
          git restore --source=HEAD -- \
            考古題庫/download_summary.json \
            考古題庫/extraction_stats.json \
            考古題庫/problematic_pdfs.json 2>/dev/null || true

      - name: Commit generated JSON data to the target branch
        if: always()
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ':(glob)考古題庫/*/115年/**/試題.json'
          git add reports/import_115_police_third.json
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "data: rebuild 115 third-class police exam questions"
          git push origin HEAD:"${TARGET_BRANCH}"

      - name: Enforce repair, cleanup, validation, and test results
        if: always()
        run: |
          echo "repair=${{ steps.repair.outcome }}"
          echo "clean=${{ steps.clean.outcome }}"
          echo "validate=${{ steps.validate.outcome }}"
          echo "tests=${{ steps.tests.outcome }}"
          test "${{ steps.repair.outcome }}" = "success"
          test "${{ steps.clean.outcome }}" = "success"
          test "${{ steps.validate.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
