name: Bootstrap complete practice fusion v2

on:
  push:
    branches: [feat/complete-practice-fusion-v2]
    paths:
      - .github/workflows/bootstrap-practice-fusion-v2.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-practice-fusion-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize reviewed plaintext source files
        env:
          PAYLOAD_SHA256: 80065bb7e7684fb1b625f6943e4e89b12a177d4dde88ac0eb4ea83ed2f367fb0
        run: |
          python - <<'PYCODE'
          import base64, hashlib, io, os, zipfile
          from pathlib import Path

          root = Path.cwd().resolve()
          chunk_dir = root / '.fusion-payload-v2'
          payload = ''.join(
              path.read_text(encoding='utf-8')
              for path in sorted(chunk_dir.glob('part-*.txt'))
          )
          data = base64.b64decode(payload, validate=True)
          actual = hashlib.sha256(data).hexdigest()
          expected = os.environ['PAYLOAD_SHA256']
          if actual != expected:
              raise SystemExit(f'payload checksum mismatch: {actual} != {expected}')

          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for info in archive.infolist():
                  target = (root / info.filename).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'unsafe archive path: {info.filename}')
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(info))
          print('materialized reviewed plaintext files')
          PYCODE

      - name: Extract explanation-only data from fixed legacy commit
        run: python scripts/migrate_legacy_practice_explanations.py --minimum 500

      - name: Run fusion regression suite
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest tests/test_practice_fusion.py -q
          node tests/frontend/practice-core.test.js
          node --check 考古題網站/js/answer-utils.js
          node --check 考古題網站/js/practice-core.js
          node --check 考古題網站/js/practice-app.js
          node --check 考古題網站/sw.js
          git diff --check

      - name: Commit plaintext implementation and remove bootstrap files
        run: |
          rm -rf .fusion-payload-v2
          rm .github/workflows/bootstrap-practice-fusion-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete archive and practice fusion'
          git push origin HEAD:feat/complete-practice-fusion-v2
