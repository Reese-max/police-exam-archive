name: Data Quality Check

on:
  push:
    branches: [master]
    paths:
      - '考古題庫/**'
      - 'tests/**'
  pull_request:
    branches: [master]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytest

      - name: Verify 115 import integrity
        run: python scripts/audit/verify_115_integrity.py

      - name: Run data quality tests
        run: python -m pytest tests/test_data_quality.py tests/test_115_remediation.py -v
