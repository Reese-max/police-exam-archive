name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run all tests
        run: python -m pytest tests/ -v --tb=short

      - name: Verify homepage stats are current
        run: python scripts/build_home_stats.py --check

      - name: Verify search index generation
        run: python scripts/build_search_index.py --output /tmp/search-index.json

      - name: Verify analytics generation
        run: python scripts/build_analytics.py --output /tmp/analytics.json
