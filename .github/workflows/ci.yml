name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run all tests
        run: python -m pytest tests/ -v --tb=short

      - name: Verify full category pages and 115 UI
        run: python scripts/build_category_pages.py --check

      - name: Verify responsive layout refinements
        run: |
          python -m py_compile scripts/apply_layout_refinements.py
          python scripts/apply_layout_refinements.py
          python scripts/apply_layout_refinements.py --check

      - name: Verify homepage stats are current
        run: python scripts/build_home_stats.py --check

      - name: Verify search index generation
        run: python scripts/build_search_index.py --output /tmp/search-index.json

      - name: Verify analytics generation
        run: python scripts/build_analytics.py --output /tmp/analytics.json

      - name: Verify analytics frontend is current
        run: python scripts/sync_analytics_frontend.py --analytics /tmp/analytics.json --check

      - name: Verify frontend JavaScript syntax
        run: |
          node --check 考古題網站/sw.js
          node --check 考古題網站/js/app.js
          node --check 考古題網站/analytics-chart.js
          node --check 考古題網站/analytics-chart-data.js
          node --check 考古題網站/_gen_data.js

  analytics-offline-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 考古題網站/package-lock.json

      - name: Install site dependencies
        working-directory: 考古題網站
        run: npm ci

      - name: Install Chromium
        working-directory: 考古題網站
        run: npx playwright install --with-deps chromium

      - name: Verify first offline Analytics visit
        working-directory: 考古題網站
        run: npx playwright test tests/analytics-offline.spec.js
