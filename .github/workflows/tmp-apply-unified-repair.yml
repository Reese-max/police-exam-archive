name: Temporary apply verified 115 English repair

on:
  push:
    branches:
      - integration/unify-practice-platform
    paths:
      - .github/workflows/tmp-apply-unified-repair.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/unify-practice-platform
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply official repair
        run: python scripts/repair/fix_115_common_english.py

      - name: Verify repaired data
        run: python scripts/repair/fix_115_common_english.py --check

      - name: Commit repaired JSON files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add '考古題庫/*/115年/中華民國憲法與警察專業英文/試題.json'
          git commit -m 'fix: restore official 115 common English questions'
          git push origin HEAD:integration/unify-practice-platform
