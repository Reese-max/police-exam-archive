name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate homepage stats
        run: python scripts/build_home_stats.py

      - name: Rebuild full category pages
        run: python scripts/build_category_pages.py

      - name: Generate search index
        run: python scripts/build_search_index.py

      - name: Generate analytics
        run: python scripts/build_analytics.py --output /tmp/analytics.json

      - name: Sync analytics frontend
        run: python scripts/sync_analytics_frontend.py --analytics /tmp/analytics.json

      - name: Verify generated frontend assets
        run: |
          python scripts/build_home_stats.py --check
          python scripts/sync_analytics_frontend.py --analytics /tmp/analytics.json --check
          node --check 考古題網站/sw.js
          node --check 考古題網站/js/app.js
          node --check 考古題網站/analytics-chart.js
          node --check 考古題網站/analytics-chart-data.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 考古題網站

      - id: deployment
        uses: actions/deploy-pages@v4
