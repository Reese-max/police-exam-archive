name: Final merge gate for verified 115 import

on:
  push:
    branches:
      - data/add-115-police-exam
    paths:
      - .github/workflows/merge-verified-115.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  final-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Require generated evidence and exact 115 coverage
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/115-import-report.md
          test -f 考古題庫/dataset_manifest.json
          test -f 考古題庫/115_import_manifest.json
          categories=$(find 考古題庫 -mindepth 2 -maxdepth 2 -type d -name '115年' | wc -l | tr -d ' ')
          questions=$(find 考古題庫 -type f -path '*/115年/*/試題.pdf' | wc -l | tr -d ' ')
          corrections=$(find 考古題庫 -type f -path '*/115年/*/更正答案.pdf' | wc -l | tr -d ' ')
          test "$categories" -eq 13
          test "$questions" -eq 90
          test "$corrections" -eq 4
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('考古題庫/dataset_manifest.json').read_text(encoding='utf-8'))
          assert data['coverage']['max_year'] == 115
          assert data['year_115']['categories'] == 13
          assert data['year_115']['subject_copies'] == 90
          assert data['year_115']['corrected_answer_pdfs'] == 4
          PY

      - name: Run full tests and build smoke checks
        run: |
          python -m pytest tests/ -v --tb=short
          python scripts/build_search_index.py --output /tmp/search-index.json
          python scripts/build_analytics.py --output /tmp/analytics.json
          test -s /tmp/search-index.json
          test -s /tmp/analytics.json

      - name: Remove this temporary gate and update PR head
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/merge-verified-115.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove temporary 115 merge gate'
            git push origin HEAD:data/add-115-police-exam
          fi

      - name: Locate import PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            number=$(gh pr list --repo "$GITHUB_REPOSITORY" \
              --head data/add-115-police-exam --base master --state open \
              --json number --jq '.[0].number // empty')
            if [ -n "$number" ]; then
              echo "number=$number" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo 'No open import PR found.' >&2
          exit 1

      - name: Wait for all PR checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            count=$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json name --jq 'length' 2>/dev/null || echo 0)
            if [ "$count" -gt 0 ]; then
              gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --watch --interval 10 --fail-fast
              exit 0
            fi
            sleep 10
          done
          echo 'No PR checks registered.' >&2
          exit 1

      - name: Squash merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --squash --delete-branch \
            --subject 'data: 收錄 115 年三等警察特考考古題'
