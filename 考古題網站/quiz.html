<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="警察特考考古題模擬考試系統，隨機出題、計時作答、自動批改">
<meta name="theme-color" content="#f0ece6">
<meta name="robots" content="index, follow">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">
<title>模擬考試｜三等警察特考</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1e8; --card:#ffffff; --card-2:#fbfaf7;
  --border:#e5e0d8; --border-strong:#d8d1c5;
  --text:#2d2a26; --text-2:#78716c; --text-3:#a39b8f;
  --header:#f0ece6;
  --primary:#4a7c5e; --primary-hover:#3d6b50; --primary-soft:#e8f0ea; --primary-tint:#f3f7f4;
  --warm:#c9a66b; --warm-soft:#f4ecdd;
  --blue:#2563eb; --blue-soft:#e6edfd;
  --danger:#c0492f; --danger-soft:#fae9e4;
  --shadow-sm:0 1px 2px rgba(45,42,38,.04), 0 1px 3px rgba(45,42,38,.05);
  --shadow-md:0 2px 4px rgba(45,42,38,.04), 0 8px 24px rgba(45,42,38,.06);
  --shadow-lg:0 4px 8px rgba(45,42,38,.05), 0 16px 40px rgba(45,42,38,.09);
  --shadow-xl:0 8px 16px rgba(45,42,38,.06), 0 24px 60px rgba(45,42,38,.12);
  --radius:16px; --radius-lg:20px; --radius-sm:11px;
}
[data-theme="dark"]{
  --bg:#1c1b18; --card:#27261f; --card-2:#22211b;
  --border:#3d3a33; --border-strong:#494539;
  --text:#e5e0d8; --text-2:#a8a096; --text-3:#7a746a;
  --header:#211f1a;
  --primary:#7db892; --primary-hover:#92c8a5; --primary-soft:#243029; --primary-tint:#21271f;
  --warm:#cdab73; --warm-soft:#2c281f;
  --blue:#6ea0f5; --blue-soft:#1f2733;
  --danger:#e0816b; --danger-soft:#2f211c;
  --shadow-sm:0 1px 2px rgba(0,0,0,.2);
  --shadow-md:0 2px 4px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.28);
  --shadow-lg:0 4px 8px rgba(0,0,0,.25), 0 16px 40px rgba(0,0,0,.4);
  --shadow-xl:0 8px 16px rgba(0,0,0,.3), 0 24px 60px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
.wrap{max-width:800px;margin:0 auto;padding:0 24px}
a{color:inherit;text-decoration:none}

/* Hero */
.hero{position:relative;overflow:hidden;padding:24px 0 40px;background:var(--header);border-bottom:1px solid var(--border);transition:background .4s,border-color .4s}
.hero::before{content:"";position:absolute;left:-140px;top:-140px;width:440px;height:440px;background:radial-gradient(circle,var(--primary-soft) 0%,transparent 68%);opacity:.85;pointer-events:none}
.hero::after{content:"";position:absolute;right:-110px;bottom:-150px;width:380px;height:380px;background:radial-gradient(circle,var(--warm-soft) 0%,transparent 70%);opacity:.6;pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);font-size:14px;font-weight:600;padding:8px 15px;border-radius:30px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:.2s}
.back-link:hover{color:var(--primary);transform:translateX(-2px);box-shadow:var(--shadow-md)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;margin-top:22px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--primary);background:var(--primary-soft);border:1px solid var(--border);padding:7px 15px;border-radius:30px;box-shadow:var(--shadow-sm)}
.eyebrow .pip{width:6px;height:6px;border-radius:50%;background:var(--primary)}
.hero h1{font-size:38px;font-weight:800;letter-spacing:-.025em;line-height:1.14;margin-top:18px;display:flex;align-items:center;gap:12px}
.hero .lead{margin-top:12px;font-size:17px;font-weight:500;color:var(--text-2)}

/* shared card */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);transition:background .4s,border-color .4s}

/* ===== Setup view ===== */
.setup-card{padding:28px 30px;margin-top:-22px;position:relative;z-index:2;box-shadow:var(--shadow-lg)}
.setup-title{font-size:18px;font-weight:700;margin-bottom:4px}
.setup-sub{font-size:14px;color:var(--text-2);font-weight:500;margin-bottom:22px}
.field{margin-bottom:20px}
.field > label{display:block;font-size:14px;font-weight:700;color:var(--text);margin-bottom:9px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.select-wrap{position:relative}
.select-wrap::after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:2px solid var(--text-2);border-bottom:2px solid var(--text-2);transform:translateY(-65%) rotate(45deg);pointer-events:none}
select{width:100%;appearance:none;font-family:inherit;font-size:14.5px;font-weight:600;color:var(--text);background:var(--card-2);border:1.5px solid var(--border-strong);border-radius:var(--radius-sm);padding:12px 34px 12px 15px;cursor:pointer;transition:.2s}
select:hover{border-color:var(--primary)}
select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.seg{display:flex;gap:9px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;font-family:inherit;font-size:14.5px;font-weight:700;color:var(--text-2);background:var(--card-2);border:1.5px solid var(--border-strong);border-radius:var(--radius-sm);padding:11px 8px;cursor:pointer;transition:.18s}
.seg button:hover{border-color:var(--primary);color:var(--primary)}
.seg button.on{background:var(--primary);color:#fff;border-color:transparent;box-shadow:var(--shadow-sm)}
.start-btn{width:100%;margin-top:8px;display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--primary);color:#fff;border:none;font-family:inherit;font-size:17px;font-weight:700;padding:16px;border-radius:var(--radius);cursor:pointer;transition:.2s;box-shadow:var(--shadow-md)}
.start-btn:hover{background:var(--primary-hover);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.match-note{margin-top:16px;text-align:center;font-size:14px;color:var(--text-2);font-weight:500}
.match-note b{color:var(--primary);font-weight:800;font-variant-numeric:tabular-nums}

/* ===== Exam view ===== */
.timer-bar{position:sticky;top:0;z-index:30;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:13px 18px;display:flex;align-items:center;gap:14px;margin-top:18px;transition:background .4s,border-color .4s}
.timer{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.timer .ti{font-size:17px}
.timer.warn{color:var(--danger)}
.prog{font-size:14px;font-weight:600;color:var(--text-2)}
.prog b{color:var(--text);font-weight:800;font-variant-numeric:tabular-nums}
.nav-btns{margin-left:auto;display:flex;align-items:center;gap:8px}
.nav-btns button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--border-strong);background:var(--card-2);color:var(--text);font-size:16px;font-weight:700;cursor:pointer;transition:.18s;display:grid;place-items:center}
.nav-btns button:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.nav-btns button:disabled{opacity:.4;cursor:not-allowed}
.submit-btn{width:auto !important;padding:0 18px !important;background:var(--danger) !important;color:#fff !important;border-color:transparent !important;font-family:inherit;font-size:14.5px;font-weight:700;border-radius:10px !important;height:38px}
.submit-btn:hover{filter:brightness(1.05)}

.q-card{padding:26px 28px;margin-top:16px}
.q-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.q-num{font-size:13px;font-weight:800;color:#fff;background:var(--primary);padding:5px 14px;border-radius:20px}
.q-meta{font-size:13px;color:var(--text-3);font-weight:600}
.flag-btn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:13px;font-weight:700;color:var(--text-2);background:var(--card-2);border:1.5px solid var(--border-strong);border-radius:20px;padding:6px 14px;cursor:pointer;transition:.18s}
.flag-btn:hover{border-color:var(--warm);color:var(--warm)}
.flag-btn.on{background:var(--warm-soft);border-color:var(--warm);color:var(--warm)}
.q-stem{font-size:17px;font-weight:600;line-height:1.7;margin-bottom:20px}
.choices{display:flex;flex-direction:column;gap:11px}
.choice{display:flex;align-items:flex-start;gap:13px;padding:15px 17px;border-radius:var(--radius);border:1.5px solid var(--border-strong);background:var(--card-2);cursor:pointer;transition:.16s}
.choice:hover{border-color:var(--primary);background:var(--primary-tint)}
.choice.sel{border-color:var(--primary);background:var(--primary-tint);box-shadow:0 0 0 3px var(--primary-soft)}
.choice .clbl{flex-shrink:0;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13.5px;font-weight:700;background:var(--card);border:1.5px solid var(--border-strong);color:var(--text-2);transition:.16s}
.choice.sel .clbl{background:var(--primary);color:#fff;border-color:transparent}
.choice .ctxt{font-size:15.5px;font-weight:500;color:var(--text);padding-top:1px}
.choice.sel .ctxt{color:var(--primary);font-weight:600}

.mini-nav{margin-top:18px;padding:20px 22px}
.mini-nav .mt{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.mini-legend{margin-left:auto;display:flex;gap:14px;font-size:12px;font-weight:600;color:var(--text-3)}
.mini-legend .ll{display:flex;align-items:center;gap:5px}
.mini-legend .sw{width:11px;height:11px;border-radius:4px}
.mini-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:9px}
.mini{aspect-ratio:1;border-radius:9px;border:1.5px solid var(--border-strong);background:var(--card-2);color:var(--text-2);font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s;font-variant-numeric:tabular-nums}
.mini:hover{border-color:var(--primary)}
.mini.done{background:var(--primary);color:#fff;border-color:transparent}
.mini.flag{border-color:var(--warm);box-shadow:inset 0 0 0 2px var(--warm-soft)}
.mini.cur{box-shadow:0 0 0 3px var(--primary-soft);border-color:var(--primary)}

/* ===== Result view ===== */
.result-card{padding:34px 30px;margin-top:-22px;position:relative;z-index:2;box-shadow:var(--shadow-lg);text-align:center}
.score-ring{width:180px;height:180px;margin:6px auto 8px;position:relative}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring .pct .big{font-size:44px;font-weight:800;color:var(--primary);line-height:1;font-variant-numeric:tabular-nums}
.score-ring .pct .lbl{font-size:13px;font-weight:600;color:var(--text-2);margin-top:5px}
.result-title{font-size:22px;font-weight:800;margin-bottom:4px}
.result-sub{font-size:14.5px;color:var(--text-2);font-weight:500}
.res-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:26px}
.rstat{background:var(--card-2);border:1px solid var(--border);border-radius:var(--radius);padding:16px 10px}
.rstat .rn{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.rstat .rl{font-size:12.5px;font-weight:600;color:var(--text-2);margin-top:7px}
.rstat.ok .rn{color:var(--primary)}
.rstat.no .rn{color:var(--danger)}
.rstat.skip .rn{color:var(--text-3)}
.rstat.time .rn{color:var(--text)}
.res-actions{display:flex;gap:12px;margin-top:26px}
.btn{flex:1;font-family:inherit;font-size:15.5px;font-weight:700;padding:14px;border-radius:var(--radius);cursor:pointer;transition:.2s;border:1.5px solid transparent}
.btn.primary{background:var(--primary);color:#fff;box-shadow:var(--shadow-sm)}
.btn.primary:hover{background:var(--primary-hover);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.btn.ghost{background:var(--card);color:var(--text-2);border-color:var(--border-strong)}
.btn.ghost:hover{border-color:var(--primary);color:var(--primary)}

.review-head{margin-top:38px;margin-bottom:16px;display:flex;align-items:center;gap:11px}
.review-head h2{font-size:21px;font-weight:700;display:flex;align-items:center;gap:11px}
.review-head h2::before{content:"";width:5px;height:21px;border-radius:3px;background:var(--danger)}
.review-head .rc{margin-left:auto;font-size:13px;font-weight:700;color:var(--danger);background:var(--danger-soft);padding:6px 14px;border-radius:20px}
.review{display:flex;flex-direction:column;gap:14px}
.rv-card{padding:22px 24px}
.rv-head{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.rv-num{font-size:12.5px;font-weight:800;color:var(--text-2);background:var(--card-2);border:1px solid var(--border);padding:4px 12px;border-radius:20px}
.rv-stem{font-size:15.5px;font-weight:600;line-height:1.65;margin-bottom:15px}
.rv-opts{display:flex;flex-direction:column;gap:8px}
.rv-opt{display:flex;align-items:flex-start;gap:11px;font-size:14.5px;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid transparent}
.rv-opt .rl2{flex-shrink:0;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--card-2);border:1px solid var(--border);color:var(--text-2)}
.rv-opt.correct{background:var(--primary-tint);border-color:var(--primary-soft)}
.rv-opt.correct .rl2{background:var(--primary);color:#fff;border-color:transparent}
.rv-opt.correct .rt{color:var(--primary);font-weight:700}
.rv-opt.wrong{background:var(--danger-soft);border-color:transparent}
.rv-opt.wrong .rl2{background:var(--danger);color:#fff;border-color:transparent}
.rv-opt.wrong .rt{color:var(--danger);text-decoration:line-through;font-weight:600}
.rv-opt .tagy{margin-left:auto;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:12px;align-self:center}
.rv-opt.correct .tagy{color:var(--primary);background:var(--primary-soft)}
.rv-opt.wrong .tagy{color:var(--danger);background:var(--card)}

footer{margin-top:48px;padding:28px 0 64px;border-top:1px solid var(--border);text-align:center;color:var(--text-3);font-size:13.5px;font-weight:500}
footer strong{color:var(--text-2);font-weight:700}

/* theme toggle */
.theme-toggle{position:fixed;right:24px;bottom:24px;z-index:60;display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:14px;font-weight:600;padding:11px 16px;border-radius:30px;cursor:pointer;box-shadow:var(--shadow-lg);transition:transform .2s,background .4s,border-color .4s}
.theme-toggle:hover{transform:translateY(-2px) scale(1.02)}
.theme-toggle .ti{font-size:17px;line-height:1}
.theme-toggle .tlabel{white-space:nowrap}

.hidden{display:none !important}

@media (max-width:560px){
  .wrap{padding:0 16px}
  .hero h1{font-size:29px}
  .field-grid{grid-template-columns:1fr}
  .res-stats{grid-template-columns:1fr 1fr}
  .res-actions{flex-direction:column}
  .mini-grid{grid-template-columns:repeat(8,1fr)}
  .timer-bar{flex-wrap:wrap}
  .nav-btns{margin-left:0;width:100%;justify-content:flex-end;margin-top:4px}
  .theme-toggle .tlabel{display:none}
  .theme-toggle{padding:13px;right:16px;bottom:16px}
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.view{animation:fadeUp .45s cubic-bezier(.2,.7,.3,1) both}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <a href="index.html" class="back-link">← 回到首頁</a>
    <span class="eyebrow"><span class="pip"></span>考古題資料庫 · 模擬測驗</span>
    <h1><span>📝</span>模擬考試</h1>
    <p class="lead">隨機出題・計時作答・自動批改。</p>
  </div>
</header>

<div class="wrap">

  <!-- ===== SETUP ===== -->
  <div id="setupView" class="view">
    <div class="card setup-card">
      <div class="setup-title">測驗設定</div>
      <div class="setup-sub">選擇範圍與條件，系統將隨機組卷。</div>

      <div class="field-grid">
        <div class="field">
          <label>類科</label>
          <div class="select-wrap"><select id="fCat"><option value="">全部類科</option></select></div>
        </div>
        <div class="field">
          <label>年份</label>
          <div class="select-wrap"><select id="fYear"><option value="">全部年份</option></select></div>
        </div>
      </div>

      <div class="field">
        <label>科目</label>
        <div class="select-wrap"><select id="fSubj"><option value="">全部科目</option></select></div>
      </div>

      <div class="field">
        <label>題目數量</label>
        <div class="seg" id="segCount">
          <button data-v="10">10 題</button>
          <button data-v="20" class="on">20 題</button>
          <button data-v="30">30 題</button>
          <button data-v="50">50 題</button>
        </div>
      </div>

      <div class="field">
        <label>考試時間</label>
        <div class="seg" id="segTime">
          <button data-v="0">不限時</button>
          <button data-v="30">30 分</button>
          <button data-v="60" class="on">60 分</button>
          <button data-v="90">90 分</button>
          <button data-v="120">120 分</button>
        </div>
      </div>

      <button class="start-btn" id="startBtn">開始考試 →</button>
      <p class="match-note">符合條件的選擇題：<b id="matchCount">載入索引中…</b></p>
    </div>
  </div>

  <!-- ===== EXAM ===== -->
  <div id="examView" class="view hidden">
    <div class="timer-bar">
      <div class="timer" id="timer"><span class="ti">⏱</span><span id="timerText">60:00</span></div>
      <div class="prog">第 <b id="curNum">1</b> / <span id="totalNum">20</span> 題</div>
      <div class="nav-btns">
        <button id="prevBtn" aria-label="上一題">←</button>
        <button id="nextBtn" aria-label="下一題">→</button>
        <button class="submit-btn" id="submitBtn">交卷</button>
      </div>
    </div>

    <div class="card q-card">
      <div class="q-head">
        <span class="q-num" id="qNum">第 1 題</span>
        <span class="q-meta" id="qMeta">憲法 · 選擇題</span>
        <button class="flag-btn" id="flagBtn">🚩 標記回顧</button>
      </div>
      <p class="q-stem" id="qStem"></p>
      <div class="choices" id="choices" role="radiogroup" aria-label="作答選項"></div>
    </div>

    <div class="card mini-nav">
      <div class="mt">答題狀況
        <span class="mini-legend">
          <span class="ll"><span class="sw" style="background:var(--primary)"></span>已答</span>
          <span class="ll"><span class="sw" style="background:var(--card-2);border:1.5px solid var(--border-strong)"></span>未答</span>
          <span class="ll"><span class="sw" style="background:var(--card-2);box-shadow:inset 0 0 0 2px var(--warm)"></span>標記</span>
        </span>
      </div>
      <div class="mini-grid" id="miniGrid"></div>
    </div>
  </div>

  <!-- ===== RESULT ===== -->
  <div id="resultView" class="view hidden">
    <div class="card result-card">
      <div class="score-ring">
        <svg width="180" height="180" viewBox="0 0 180 180">
          <circle cx="90" cy="90" r="78" fill="none" stroke="var(--border)" stroke-width="14"></circle>
          <circle id="ringFill" cx="90" cy="90" r="78" fill="none" stroke="var(--primary)" stroke-width="14" stroke-linecap="round" stroke-dasharray="490" stroke-dashoffset="490" style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.7,.3,1)"></circle>
        </svg>
        <div class="pct"><span class="big" id="scorePct">0%</span><span class="lbl">正確率</span></div>
      </div>
      <div class="result-title" id="resultTitle">作答完成！</div>
      <div class="result-sub" id="resultSub">繼續加油，錯題已為你整理好。</div>

      <div class="res-stats">
        <div class="rstat ok"><div class="rn" id="sOk">0</div><div class="rl">答對</div></div>
        <div class="rstat no"><div class="rn" id="sNo">0</div><div class="rl">答錯</div></div>
        <div class="rstat skip"><div class="rn" id="sSkip">0</div><div class="rl">未答</div></div>
        <div class="rstat time"><div class="rn" id="sTime">0:00</div><div class="rl">用時</div></div>
      </div>

      <div class="res-actions">
        <button class="btn primary" id="retryBtn">再考一次</button>
        <a class="btn ghost" href="index.html">回首頁</a>
      </div>
    </div>

    <div class="review-head">
      <h2>錯題回顧</h2>
      <span class="rc" id="reviewCount">0 題</span>
    </div>
    <div class="review" id="review"></div>
  </div>

  <footer>資料來源：<strong>考選部考畢試題查詢平臺</strong></footer>
</div>

<button class="theme-toggle" id="themeToggle" aria-label="切換深色模式">
  <span class="ti" id="themeIcon">🌙</span>
  <span class="tlabel" id="themeLabel">深色模式</span>
</button>

<script src="https://cdn.jsdelivr.net/npm/minisearch@7.1.1/dist/umd/index.js"></script>
<script src="js/search-engine.js"></script>
<script>
/* ===== 真實題庫（minisearch + search-engine.js，36,210 道選擇題） ===== */
let POOL = [];
let indexReady = false;

function _esc(s){ if(!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function _short(s,n){ s=s||''; return s.length>n ? s.slice(0,n)+'…' : s; }

function refreshPool(){
  if(!indexReady) return;
  const yv = $('fYear').value;
  POOL = SearchEngine.search('', {
    cat: $('fCat').value, yr: yv?parseInt(yv,10):null, sub: $('fSubj').value,
    type:'choice', ans:'',
  }, 99999).filter(q => q.optA && q.optB && q.optC && q.optD && 'ABCD'.indexOf(q.ans) >= 0);
  $('matchCount').textContent = POOL.length.toLocaleString() + ' 題';
  $('startBtn').disabled = POOL.length === 0;
}

/* state */
const TOTAL = 20;
let questions = [], answers = [], flags = [], cur = 0;
let total = TOTAL, durSec = 60*60, remain = durSec, timerId = null, elapsed = 0;

const $ = id => document.getElementById(id);

/* segmented controls */
function setupSeg(id){
  $(id).addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    $(id).querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
  });
}
setupSeg('segCount'); setupSeg('segTime');

function buildQuestions(n){
  // 洗牌真實題池，抽前 n 題，轉成本頁題目格式（文字先 escape，渲染端用 innerHTML）
  const pool = [...POOL];
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  questions = pool.slice(0,n).map(q=>({
    subj: q.yr + '年 ' + _esc(_short(q.sub,14)),
    stem: _esc(q.stem),
    opts: [q.optA,q.optB,q.optC,q.optD].map(_esc),
    ans: 'ABCD'.indexOf(q.ans),
  }));
  answers = new Array(questions.length).fill(null);
  flags = new Array(questions.length).fill(false);
  cur = 0;
}

/* ===== start ===== */
$('startBtn').addEventListener('click', ()=>{
  const want = +document.querySelector('#segCount .on').dataset.v;
  const tmin = +document.querySelector('#segTime .on').dataset.v;
  if(POOL.length===0){ alert('沒有符合條件的題目，請調整篩選條件。'); return; }
  if(POOL.length<want && !confirm('符合條件的題目只有 '+POOL.length+' 題，將全部出題。確定開始？')) return;
  buildQuestions(want);
  total = questions.length;
  $('totalNum').textContent = total;
  durSec = tmin*60; remain = durSec; elapsed = 0;
  switchView('exam');
  renderQuestion(); renderMini();
  startTimer(tmin>0);
  window.scrollTo({top:0});
});

/* ===== 載入真實索引 + facets ===== */
function _fill(id, items, sfx){
  const sel=$(id);
  items.forEach(it=>{ const o=document.createElement('option'); o.value=String(it); o.textContent=it+sfx; sel.appendChild(o); });
}
$('startBtn').disabled = true;
SearchEngine.loadIndex().then(()=>{
  indexReady = true;
  const f = SearchEngine.getFacets();
  _fill('fCat', f.categories, '');
  _fill('fYear', f.years.map(String).reverse(), ' 年');
  _fill('fSubj', f.subjects, '');
  refreshPool();
}).catch(err=>{ $('matchCount').textContent = '索引載入失敗：' + err.message; });
['fCat','fYear','fSubj'].forEach(id=>$(id).addEventListener('change', refreshPool));

/* ===== timer ===== */
function fmt(s){const m=Math.floor(s/60),sec=s%60;return m+':'+String(sec).padStart(2,'0')}
function fmtMMSS(s){const m=Math.floor(s/60),sec=s%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}
function startTimer(countdown){
  clearInterval(timerId);
  if(countdown){
    $('timerText').textContent = fmtMMSS(remain);
    timerId = setInterval(()=>{
      remain--; elapsed++;
      $('timerText').textContent = fmtMMSS(Math.max(remain,0));
      if(remain<=60) $('timer').classList.add('warn');
      if(remain<=0){clearInterval(timerId); finish();}
    },1000);
  } else {
    $('timerText').textContent = fmtMMSS(0);
    timerId = setInterval(()=>{ elapsed++; $('timerText').textContent = fmtMMSS(elapsed); },1000);
  }
}

/* ===== render question ===== */
function renderQuestion(){
  const q = questions[cur];
  $('qNum').textContent = '第 '+(cur+1)+' 題';
  $('curNum').textContent = cur+1;
  $('qMeta').textContent = q.subj + ' · 選擇題';
  $('qStem').innerHTML = q.stem; // 題幹於 buildQuestions 已 escape
  $('flagBtn').classList.toggle('on', flags[cur]);
  $('choices').innerHTML = q.opts.map((o,i)=>{
    const sel = answers[cur]===i;
    return `<div class="choice${sel?' sel':''}" data-i="${i}" role="radio" aria-checked="${sel}" tabindex="0"><span class="clbl">${'ABCD'[i]}</span><span class="ctxt">${o}</span></div>`;
  }).join('');
  $('choices').querySelectorAll('.choice').forEach(el=>{
    const pick = ()=>{ answers[cur] = +el.dataset.i; renderQuestion(); renderMini(); };
    el.addEventListener('click', pick);
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); } });
  });
  $('prevBtn').disabled = cur===0;
  $('nextBtn').disabled = cur===total-1;
}
$('prevBtn').addEventListener('click',()=>{if(cur>0){cur--;renderQuestion();renderMini();}});
$('nextBtn').addEventListener('click',()=>{if(cur<total-1){cur++;renderQuestion();renderMini();}});
$('flagBtn').addEventListener('click',()=>{flags[cur]=!flags[cur];renderQuestion();renderMini();});

function renderMini(){
  $('miniGrid').innerHTML = questions.map((_,i)=>{
    let c='mini';
    if(answers[i]!==null) c+=' done';
    if(flags[i]) c+=' flag';
    if(i===cur) c+=' cur';
    return `<button class="${c}" data-i="${i}">${i+1}</button>`;
  }).join('');
  $('miniGrid').querySelectorAll('.mini').forEach(el=>{
    el.addEventListener('click',()=>{cur=+el.dataset.i;renderQuestion();renderMini();});
  });
}

/* ===== finish / result ===== */
$('submitBtn').addEventListener('click',()=>{
  const unanswered = answers.filter(a=>a===null).length;
  if(unanswered>0 && !confirm('還有 '+unanswered+' 題未作答，確定交卷？')) return;
  finish();
});
function finish(){
  clearInterval(timerId);
  let ok=0,no=0,skip=0;
  questions.forEach((q,i)=>{
    if(answers[i]===null) skip++;
    else if(answers[i]===q.ans) ok++;
    else no++;
  });
  const pct = Math.round(ok/total*100);
  switchView('result');
  window.scrollTo({top:0});
  // ring
  const circ = 490;
  setTimeout(()=>{ $('ringFill').style.strokeDashoffset = circ*(1-pct/100); },120);
  // count up pct
  let p=0; const ti=setInterval(()=>{p++; $('scorePct').textContent=p+'%'; if(p>=pct)clearInterval(ti);},14);
  $('sOk').textContent=ok; $('sNo').textContent=no; $('sSkip').textContent=skip;
  $('sTime').textContent=fmt(elapsed);
  // title
  if(pct>=80){$('resultTitle').textContent='表現優異！';$('resultSub').textContent='正確率很高，繼續保持這個節奏。';}
  else if(pct>=60){$('resultTitle').textContent='穩定成長中';$('resultSub').textContent='基礎不錯，加強錯題就能更上層樓。';}
  else {$('resultTitle').textContent='繼續加油！';$('resultSub').textContent='錯題已為你整理好，逐題突破。';}
  // review (wrong + skipped)
  const wrong = questions.map((q,i)=>({q,i})).filter(({q,i})=>answers[i]!==q.ans);
  $('reviewCount').textContent = wrong.length+' 題';
  $('review').innerHTML = wrong.map(({q,i})=>{
    const opts = q.opts.map((o,j)=>{
      const isCorrect = j===q.ans;
      const isWrong = answers[i]===j && j!==q.ans;
      let cls='rv-opt', tag='';
      if(isCorrect){cls+=' correct';tag='<span class="tagy">正解</span>';}
      else if(isWrong){cls+=' wrong';tag='<span class="tagy">你的答案</span>';}
      return `<div class="${cls}"><span class="rl2">${'ABCD'[j]}</span><span class="rt">${o}</span>${tag}</div>`;
    }).join('');
    return `<article class="card rv-card">
      <div class="rv-head"><span class="rv-num">第 ${i+1} 題</span><span class="q-meta">${q.subj} · 選擇題</span></div>
      <p class="rv-stem">${q.stem}</p>
      <div class="rv-opts">${opts}</div>
    </article>`;
  }).join('') || '<div class="card rv-card" style="text-align:center;color:var(--text-2)">🎉 全部答對，沒有錯題！</div>';
}

$('retryBtn').addEventListener('click',()=>{
  switchView('setup');
  $('timer').classList.remove('warn');
  window.scrollTo({top:0});
});

function switchView(v){
  ['setup','exam','result'].forEach(name=>{
    $(name+'View').classList.toggle('hidden', name!==v);
  });
}

/* ===== theme — 全站共用 localStorage key「exam-dark」(true/false) ===== */
(function(){
  const btn=$('themeToggle'),icon=$('themeIcon'),label=$('themeLabel');
  function apply(dark){
    document.documentElement.setAttribute('data-theme',dark?'dark':'light');
    icon.textContent=dark?'☀️':'🌙';label.textContent=dark?'淺色模式':'深色模式';
    try{localStorage.setItem('exam-dark',dark);}catch(e){}
  }
  let saved=null; try{saved=localStorage.getItem('exam-dark');}catch(e){}
  apply(saved==='true'||(saved===null&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches));
  btn.addEventListener('click',()=>apply(document.documentElement.getAttribute('data-theme')!=='dark'));
})();
</script>
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(function(){}); }
</script>
</body>
