<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="搜尋三等警察特考歷屆試題，支援題幹、選項、閱讀文章、年度、類科、科目、題型與答案篩選。">
<meta name="theme-color" content="#17324d">
<link rel="canonical" href="search.html">
<title>全文搜尋｜三等警察特考題庫</title>
<style>
:root{--bg:#f3f5f7;--surface:#fff;--surface-2:#f7f9fb;--line:#dbe2e8;--text:#17212b;--muted:#607080;--primary:#173f5f;--green:#0c6b58;--soft:#e8f1f6;--correct:#e6f5ed;--correct-line:#188454;--shadow:0 8px 28px rgba(20,42,60,.08);--radius:14px}
[data-theme="dark"]{--bg:#111820;--surface:#1a2530;--surface-2:#202d39;--line:#344452;--text:#edf3f7;--muted:#a8b5bf;--primary:#7eb5d8;--green:#72cbb1;--soft:#243847;--correct:#1b382d;--correct-line:#75d5a8;--shadow:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.65}.shell{width:min(1080px,calc(100% - 28px));margin:auto}.top{background:#17324d;color:#fff;padding:18px 0 44px}.top-row{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:800;color:#fff;text-decoration:none}.nav{display:flex;gap:16px}.nav a{color:#fff;text-decoration:none;font-size:14px}.theme{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:999px;padding:7px 12px}.hero{margin-top:30px}.hero h1{font-size:clamp(30px,6vw,46px);margin:0;line-height:1.15}.hero p{margin:10px 0 0;color:#d9e5ed}.main{margin-top:-25px;padding-bottom:60px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.search-card{padding:22px}.search-row{display:flex;gap:10px}.search-row input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:10px;padding:12px 14px;font:inherit}.search-row button{border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:10px;padding:10px 20px;font-weight:750}.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}.filters select{width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:9px;padding:9px 10px}.summary{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:14px;padding:14px 4px}.summary strong{color:var(--primary)}.results{display:grid;gap:13px}.result{padding:20px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted);background:var(--surface-2)}.tag.answer{color:var(--green);border-color:var(--correct-line)}.stem{font-size:17px;font-weight:720;margin:0 0 13px}.passage{white-space:pre-line;background:var(--surface-2);border-left:4px solid var(--green);border-radius:8px;padding:14px 16px;margin-bottom:14px;font-size:14px}.passage summary{cursor:pointer;font-weight:750;color:var(--green)}.passage div{margin-top:10px}.blank{background:#fff0ae;color:#513800;border-radius:5px;padding:1px 5px;font-weight:800}.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.option{display:flex;gap:9px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:10px 11px}.option.correct{background:var(--correct);border-color:var(--correct-line)}.letter{font-weight:850;color:var(--primary)}mark.hl{background:#ffef8e;color:#403000;padding:0 2px;border-radius:2px}.actions{display:flex;justify-content:flex-end;margin-top:14px}.actions a{color:var(--primary);text-decoration:none;font-weight:700;font-size:14px}.empty{padding:34px;text-align:center;color:var(--muted)}.more{display:block;margin:18px auto 0;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:10px 20px}.hidden{display:none!important}
@media(max-width:800px){.filters{grid-template-columns:1fr 1fr}.nav{display:none}.options{grid-template-columns:1fr}}@media(max-width:480px){.search-row{flex-direction:column}.filters{grid-template-columns:1fr}.result{padding:17px}}
</style>
</head>
<body>
<header class="top"><div class="shell"><div class="top-row"><a class="brand" href="index.html">三等警察特考題庫</a><nav class="nav" aria-label="主要導覽"><a href="practice.html">線上練習</a><a href="analytics.html">統計分析</a></nav><button id="themeBtn" class="theme">深色模式</button></div><div class="hero"><h1>全文搜尋</h1><p>同時搜尋題幹、選項與閱讀文章；共用考卷可依任一所屬類科找到。</p></div></div></header>
<main class="shell main">
<section class="card search-card" role="search">
  <div class="search-row"><input id="query" type="search" placeholder="輸入關鍵字，例如：基本權、Zero Trust、酒駕" aria-label="搜尋關鍵字"><button id="searchBtn">搜尋</button></div>
  <div class="filters">
    <select id="year" aria-label="年度"><option value="">全部年度</option></select>
    <select id="category" aria-label="類科"><option value="">全部類科</option></select>
    <select id="subject" aria-label="科目"><option value="">全部科目</option></select>
    <select id="type" aria-label="題型"><option value="">全部題型</option><option value="choice">選擇題</option><option value="essay">申論題</option></select>
    <select id="answer" aria-label="答案"><option value="">全部答案</option><option>A</option><option>B</option><option>C</option><option>D</option><option>送分</option></select>
  </div>
</section>
<div class="summary"><span>索引：<strong id="total">載入中…</strong></span><span>結果：<strong id="found">—</strong></span><span id="time">—</span></div>
<section id="results" class="results"><div class="card empty">正在載入題庫索引…</div></section>
<button id="moreBtn" class="more hidden">載入更多</button>
</main>
<script src="https://cdn.jsdelivr.net/npm/minisearch@7.1.1/dist/umd/index.js"></script>
<script src="js/answer-utils.js"></script>
<script src="js/search-engine.js"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)},PAGE=40,LIMIT=800,all=[],shown=0,ready=false,query='';
function esc(value){return String(value||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function regexEsc(value){return value.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function highlight(value){var html=esc(value);query.trim().split(/\s+/).filter(Boolean).forEach(function(word){html=html.replace(new RegExp('('+regexEsc(esc(word))+')','gi'),'<mark class="hl">$1</mark>')});return html}
function passageHtml(value){return highlight(value).replace(/\[\[(\d+)\]\]/g,'<span class="blank">[$1]</span>').replace(/\n/g,'<br>')}
function fill(select,items,suffix){items.forEach(function(item){var option=document.createElement('option');option.value=String(item);option.textContent=String(item)+(suffix||'');select.appendChild(option)})}
function filters(){return {yr:$('year').value?parseInt($('year').value,10):null,cat:$('category').value,sub:$('subject').value,type:$('type').value,ans:$('answer').value}}
function updateSubjects(){var keep=$('subject').value;var f=filters();f.sub='';var matches=SearchEngine.search('',f,99999);var subjects=Array.from(new Set(matches.map(function(item){return item.sub}).filter(Boolean))).sort();$('subject').innerHTML='<option value="">全部科目</option>';fill($('subject'),subjects,'');if(subjects.indexOf(keep)!==-1)$('subject').value=keep;run()}
function card(item){var accepted=AnswerUtils.acceptedAnswers(item.ans);var tags='<span class="tag">'+esc(item.yr)+' 年</span><span class="tag">'+esc(item.sub)+'</span><span class="tag">'+esc(item.type==='choice'?'選擇題':'申論題')+'</span>'+(item.ans?'<span class="tag answer">答案 '+esc(AnswerUtils.display(item.ans))+'</span>':'');var passage=item.passage?'<details class="passage" open><summary>閱讀文章</summary><div>'+passageHtml(item.passage)+'</div></details>':'';var options='';if(item.type==='choice'){options='<div class="options">'+['A','B','C','D'].map(function(letter){return '<div class="option'+(accepted.indexOf(letter)!==-1?' correct':'')+'"><span class="letter">'+letter+'</span><span>'+highlight(item['opt'+letter])+'</span></div>'}).join('')+'</div>'}var practice=new URL('practice.html',location.href);if(item.cats&&item.cats.length)practice.searchParams.set('category',item.cats[0]);if(item.yr)practice.searchParams.set('year',item.yr);if(item.sub)practice.searchParams.set('subject',item.sub);return '<article class="card result"><div class="tags">'+tags+'</div>'+passage+'<p class="stem">'+highlight(item.stem)+'</p>'+options+'<div class="actions"><a href="'+esc(practice.href)+'">用此條件開始練習 →</a></div></article>'}
function render(){if(!all.length){$('results').innerHTML='<div class="card empty">找不到符合條件的題目，請調整關鍵字或篩選條件。</div>';$('moreBtn').classList.add('hidden');return}var end=Math.min(shown+PAGE,all.length),html='';for(var i=shown;i<end;i++)html+=card(all[i]);if(shown===0)$('results').innerHTML=html;else $('results').insertAdjacentHTML('beforeend',html);shown=end;$('moreBtn').classList.toggle('hidden',shown>=all.length)}
function run(){if(!ready)return;query=$('query').value;var start=performance.now();all=SearchEngine.search(query,filters(),LIMIT);shown=0;$('found').textContent=(all.length>=LIMIT?LIMIT+'+':all.length.toLocaleString())+' 題';$('time').textContent='耗時 '+Math.round(performance.now()-start)+' ms';render();var url=new URL(location.href);query?url.searchParams.set('q',query):url.searchParams.delete('q');history.replaceState(null,'',url)}
$('searchBtn').addEventListener('click',run);$('query').addEventListener('keydown',function(event){if(event.key==='Enter')run()});$('moreBtn').addEventListener('click',render);['type','answer','subject'].forEach(function(id){$(id).addEventListener('change',run)});['year','category'].forEach(function(id){$(id).addEventListener('change',updateSubjects)});
$('themeBtn').addEventListener('click',function(){var dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('themeBtn').textContent=dark?'淺色模式':'深色模式';try{localStorage.setItem('exam-dark',String(dark))}catch(error){}});try{if(localStorage.getItem('exam-dark')==='true')$('themeBtn').click()}catch(error){}
var initial=new URLSearchParams(location.search).get('q');if(initial)$('query').value=initial;
SearchEngine.loadIndex().then(function(stats){ready=true;$('total').textContent=stats.total.toLocaleString()+' 題';var facets=SearchEngine.getFacets();fill($('year'),facets.years.slice().reverse(),' 年');fill($('category'),facets.categories,'');fill($('subject'),facets.subjects,'');if(initial)run();else $('results').innerHTML='<div class="card empty">輸入關鍵字，或直接使用篩選條件瀏覽題庫。</div>'}).catch(function(error){$('results').innerHTML='<div class="card empty">索引載入失敗：'+esc(error.message)+'</div>'});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){});
})();
</script>
</body>
</html>
