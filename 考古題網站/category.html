<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>正在開啟完整類科題庫｜三等警察特考</title>
<meta name="robots" content="noindex,follow">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f1e8;color:#2d2a26;font-family:"Noto Sans TC",system-ui,sans-serif}.card{max-width:520px;margin:24px;padding:28px;background:#fff;border:1px solid #e5e0d8;border-radius:10px;text-align:center}.card p{color:#78716c}.card a{display:inline-block;margin-top:8px;padding:10px 18px;border-radius:8px;background:#4a7c5e;color:#fff;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<main class="card">
<h1>正在開啟完整類科題庫</h1>
<p id="message">正在回到原本的完整介面與功能。</p>
<a id="fallback" href="index.html">回到首頁</a>
</main>
<script>
(function () {
  'use strict';
  var categories = [
    '刑事警察學系','鑑識科學學系','交通學系交通組','交通學系電訊組',
    '消防學系','水上警察學系','資訊管理學系','行政警察學系','外事警察學系',
    '公共安全學系社安組','公共安全學系情報組','犯罪防治學系預防組',
    '犯罪防治學系矯治組','國境警察學系境管組','國境警察學系移民組',
    '行政管理學系','法律學系'
  ];
  var cat = new URLSearchParams(location.search).get('cat') || '';
  var message = document.getElementById('message');
  var fallback = document.getElementById('fallback');
  if (categories.indexOf(cat) === -1) {
    message.textContent = '找不到指定類科，請從首頁重新選擇。';
    return;
  }
  var target = encodeURIComponent(cat) + '/' + encodeURIComponent(cat + '考古題總覽.html') + location.hash;
  fallback.href = target;
  fallback.textContent = '開啟' + cat + '完整題庫';
  location.replace(target);
})();
</script>
</body>
</html>
